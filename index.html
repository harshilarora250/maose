<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaOSe - WebOS</title>
    <link rel="stylesheet" href="welcome.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Jersey+10+Charted&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Guides&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fontdiner+Swanky&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>
    <img class="son" src="assets/son.png">
    <div class="welcome-container">
        <img class="hc" src="assets/hc.png">
        <h1 class="welcome-main">Welcome to MaOSe</h1>
        <p class="welcome-sub">Your Personal WebOS</p>
        <hr class="welcome-setup-divider">
        <h2 class="setup">Let's get you setup</h2>
        <label class="name-setup" for="name">What's your name?<span style="color: red;">*</span></label>
        <br>
        <input class="name-input" type="text" name="yourName">
        <br>
        <br>
        <label class="username-setup" for="username" required>What do you want your username to be?<span style="color: red;">*</span></label>
        <br>
        <input id="username-input" class="username-input" type="text" name="yourUsername" required>
        <br>
        <br>
        <a class="letsgo" href="welcome.html">Let's go!</a>
    </div>


<script src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.js"></script>
<script src="script.js"></script>
</body>
</html>
